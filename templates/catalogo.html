<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Catálogo de Productos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">

    <!-- ── NAVBAR ─────────────────────────────────────────────────────────── -->
    <nav class="bg-white shadow mb-6">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <span class="text-lg font-bold text-gray-800">Marketplace</span>
            <div class="flex items-center gap-4">
                <div class="text-sm text-gray-600">
                    <span class="font-medium">{{ usuario }}</span>
                    <span class="ml-2 bg-green-100 text-green-700 font-bold px-2 py-0.5 rounded-full text-xs">Comprador</span>
                </div>
                <form method="POST" action="/logout">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button type="submit"
                        class="bg-red-500 hover:bg-red-600 text-white text-sm font-bold py-1 px-4 rounded shadow">
                        Cerrar sesión
                    </button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container mx-auto px-4 pb-8">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold text-gray-800">Catálogo de Productos</h1>
            <span id="contador" class="text-sm text-gray-400"></span>
        </div>

        <!-- Alertas -->
        <div id="alerta" class="hidden mb-4 p-4 rounded text-white"></div>

        <!-- ── Barra de búsqueda y filtros ──────────────────────────────── -->
        <div class="bg-white shadow-md rounded-lg p-4 mb-6 flex flex-col sm:flex-row gap-3">
            <input type="text" id="buscador" placeholder="🔍 Buscar por nombre o categoría..."
                oninput="filtrar()"
                class="flex-1 border rounded p-2 text-sm focus:ring focus:ring-blue-300">
            <select id="filtro-categoria" onchange="filtrar()"
                class="border rounded p-2 text-sm w-full sm:w-48">
                <option value="">Todas las categorías</option>
            </select>
            <div class="flex gap-2 items-center">
                <label class="text-xs text-gray-500 whitespace-nowrap">Precio máx:</label>
                <input type="number" id="filtro-precio" min="0" placeholder="Sin límite"
                    oninput="filtrar()"
                    class="border rounded p-2 text-sm w-28">
            </div>
            <button onclick="limpiarFiltros()"
                class="bg-gray-200 hover:bg-gray-300 text-gray-700 text-sm font-bold py-2 px-4 rounded">
                Limpiar
            </button>
        </div>

        <!-- ── Grid de tarjetas ──────────────────────────────────────────── -->
        <div id="grid-productos" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <div class="col-span-full text-center py-12 text-gray-400">Cargando productos...</div>
        </div>
    </div>

    <!-- ── MODAL DETALLE ──────────────────────────────────────────────────── -->
    <div id="modal-detalle" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl mx-4 max-h-screen overflow-y-auto">
            <div class="flex justify-between items-center p-6 border-b">
                <h2 class="text-xl font-bold text-gray-800">Detalles del Producto</h2>
                <button onclick="cerrarModal()" class="text-gray-400 hover:text-gray-600 text-2xl font-bold">&times;</button>
            </div>
            <div id="detalle-contenido" class="p-6 space-y-4">
                <p class="text-center text-gray-400">Cargando...</p>
            </div>
        </div>
    </div>

    <script>
        // SEGURIDAD: Todas las peticiones al /api incluyen X-Requested-With
        // para que el backend rechace cualquier acceso externo directo.
        function apiFetch(url) {
            return fetch(url, {
                headers: {
                    'Content-Type': 'application/json',
                    'X-Requested-With': 'XMLHttpRequest'
                }
            });
        }

        function mostrarAlerta(mensaje, tipo) {
            const alerta = document.getElementById('alerta');
            alerta.textContent = mensaje;
            alerta.className = `mb-4 p-4 rounded text-white ${tipo === 'success' ? 'bg-green-500' : 'bg-red-500'}`;
            alerta.classList.remove('hidden');
            setTimeout(() => alerta.classList.add('hidden'), 4000);
        }

        let todosLosProductos = [];

        // ── Carga inicial ──────────────────────────────────────────────────
        async function cargarProductos() {
            try {
                const res = await apiFetch('/api/productos');
                const data = await res.json();
                if (!res.ok) { mostrarAlerta('Error al cargar productos.', 'error'); return; }
                todosLosProductos = data;
                poblarCategorias(data);
                renderGrid(data);
            } catch {
                mostrarAlerta('Error al conectar con el servidor.', 'error');
            }
        }

        // ── Poblar dropdown de categorías con valores únicos ──────────────
        function poblarCategorias(productos) {
            const categorias = [...new Set(productos.map(p => p.Categoria).filter(Boolean))].sort();
            const select = document.getElementById('filtro-categoria');
            categorias.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c;
                opt.textContent = c;
                select.appendChild(opt);
            });
        }

        // ── Filtrar por búsqueda, categoría y precio ───────────────────────
        function filtrar() {
            const texto = document.getElementById('buscador').value.toLowerCase().trim();
            const categoria = document.getElementById('filtro-categoria').value;
            const precioMax = parseFloat(document.getElementById('filtro-precio').value);

            const filtrados = todosLosProductos.filter(p => {
                const coincideTexto = !texto ||
                    (p.Nombre || '').toLowerCase().includes(texto) ||
                    (p.Categoria || '').toLowerCase().includes(texto);
                const coincideCategoria = !categoria || p.Categoria === categoria;
                const coincidePrecio = isNaN(precioMax) || p.Precio <= precioMax;
                return coincideTexto && coincideCategoria && coincidePrecio;
            });

            renderGrid(filtrados);
        }

        function limpiarFiltros() {
            document.getElementById('buscador').value = '';
            document.getElementById('filtro-categoria').value = '';
            document.getElementById('filtro-precio').value = '';
            renderGrid(todosLosProductos);
        }

        // ── Render de tarjetas ─────────────────────────────────────────────
        function renderGrid(productos) {
            const grid = document.getElementById('grid-productos');
            document.getElementById('contador').textContent =
                `${productos.length} producto${productos.length !== 1 ? 's' : ''}`;

            if (!productos.length) {
                grid.innerHTML = '<div class="col-span-full text-center py-12 text-gray-400">No se encontraron productos.</div>';
                return;
            }

            grid.innerHTML = productos.map(p => `
                <div class="bg-white rounded-lg shadow-md overflow-hidden flex flex-col hover:shadow-lg transition-shadow">
                    <!-- Imagen placeholder -->
                    <div class="bg-gray-200 h-40 flex items-center justify-center text-gray-400 text-4xl">
                        📦
                    </div>
                    <div class="p-4 flex flex-col flex-1">
                        <span class="text-xs font-bold text-blue-500 uppercase tracking-wide mb-1">${p.Categoria || 'Sin categoría'}</span>
                        <h3 class="font-bold text-gray-800 text-sm mb-1 leading-tight">${p.Nombre}</h3>
                        <p class="text-xs text-gray-400 mb-2">ID: ${p.productoID}</p>
                        <div class="flex justify-between items-center mt-auto pt-3 border-t">
                            <span class="text-lg font-bold text-green-600">$${p.Precio}</span>
                            <span class="text-xs ${p.Stock > 0 ? 'text-green-500' : 'text-red-400'} font-medium">
                                ${p.Stock > 0 ? `${p.Stock} en stock` : 'Sin stock'}
                            </span>
                        </div>
                        <button onclick="verDetalle('${p.productoID}')"
                            class="mt-3 w-full bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold py-2 rounded">
                            Ver detalle
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // ── Modal detalle ──────────────────────────────────────────────────
        async function verDetalle(id) {
            document.getElementById('detalle-contenido').innerHTML = '<p class="text-center text-gray-400">Cargando...</p>';
            document.getElementById('modal-detalle').classList.remove('hidden');
            try {
                const res = await apiFetch(`/api/productos/${id}`);
                if (!res.ok) throw new Error();
                const p = await res.json();
                const log = p.LogisticaEnvio || {};
                const dim = log.DimensionesCm || {};
                document.getElementById('detalle-contenido').innerHTML = `
                    <div class="grid grid-cols-2 gap-4 border-b pb-4">
                        <div><span class="block text-xs font-bold text-gray-400 uppercase">ID</span>
                            <span class="text-lg font-semibold text-gray-800">${p.productoID}</span></div>
                        <div><span class="block text-xs font-bold text-gray-400 uppercase">Nombre</span>
                            <span class="text-lg font-semibold text-gray-800">${p.Nombre}</span></div>
                    </div>
                    <div class="grid grid-cols-3 gap-4 border-b pb-4">
                        <div><span class="block text-xs font-bold text-gray-400 uppercase">Categoría</span>
                            <span class="text-gray-700">${p.Categoria}</span></div>
                        <div><span class="block text-xs font-bold text-gray-400 uppercase">Precio</span>
                            <span class="font-bold text-green-600">$${p.Precio}</span></div>
                        <div><span class="block text-xs font-bold text-gray-400 uppercase">Stock</span>
                            <span class="text-gray-700">${p.Stock} unidades</span></div>
                    </div>
                    <div class="grid grid-cols-3 gap-4 border-b pb-4">
                        <div><span class="block text-xs font-bold text-gray-400 uppercase">Color</span>
                            <span class="text-gray-700">${p.Color || 'N/A'}</span></div>
                        <div><span class="block text-xs font-bold text-gray-400 uppercase">Material</span>
                            <span class="text-gray-700">${p.Material || 'N/A'}</span></div>
                        <div><span class="block text-xs font-bold text-gray-400 uppercase">Talla</span>
                            <span class="text-gray-700">${p.Talla || 'N/A'}</span></div>
                    </div>
                    <div class="border-b pb-4">
                        <span class="block text-xs font-bold text-gray-400 uppercase">Vendedor ID</span>
                        <span class="text-gray-700">${p.VendedorID || 'N/A'}</span>
                    </div>
                    <div class="bg-gray-50 border p-4 rounded-lg">
                        <h3 class="font-bold text-gray-700 mb-3 border-b pb-2">📦 Logística de Envío</h3>
                        ${dim.Alto !== undefined ? `
                        <div class="grid grid-cols-2 gap-4 text-sm">
                            <div><span class="block font-semibold text-gray-600">Dimensiones:</span>
                                <span>${dim.Alto}cm x ${dim.Ancho}cm x ${dim.Profundidad}cm</span></div>
                            <div><span class="block font-semibold text-gray-600">Peso:</span>
                                <span>${log.PesoKg} Kg</span></div>
                            <div><span class="block font-semibold text-gray-600">Tipo de Empaque:</span>
                                <span>${log.TipoEmpaque}</span></div>
                            <div><span class="block font-semibold text-gray-600">Manejo Frágil:</span>
                                <span>${log.RequiereFragil ? 'Sí ⚠️' : 'No'}</span></div>
                        </div>` : '<p class="text-sm text-gray-500">Sin información de logística.</p>'}
                    </div>`;
            } catch {
                document.getElementById('detalle-contenido').innerHTML =
                    '<p class="text-center text-red-500">No se pudo cargar el producto.</p>';
            }
        }

        function cerrarModal() {
            document.getElementById('modal-detalle').classList.add('hidden');
        }

        document.getElementById('modal-detalle').addEventListener('click', function (e) {
            if (e.target === this) cerrarModal();
        });

        cargarProductos();
    </script>
</body>
</html>
