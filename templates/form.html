<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title id="titulo-pagina">Producto</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans leading-normal tracking-normal">
    <div class="container mx-auto px-4 py-8 max-w-2xl">
        <h1 id="titulo-h1" class="text-3xl font-bold text-gray-800 mb-6"></h1>

        <!-- Alertas -->
        <div id="alerta" class="hidden mb-4 p-4 rounded text-white"></div>

        <form id="form-producto" class="bg-white shadow-md rounded-lg p-6 space-y-4">

            <div>
                <label class="block text-gray-700 font-bold mb-2">Producto ID:</label>
                <!-- SEGURIDAD: pattern exige formato LETRAS-ALFANUMERICO (ej: PROD-001) desde el frontend. -->
                <input type="text" id="productoID"
                    pattern="[A-Za-z]{1,20}-[A-Za-z0-9]{1,20}"
                    title="Formato requerido: LETRAS-ALFANUMERICO (ej: PROD-001)"
                    placeholder="Ej: PROD-001"
                    maxlength="50"
                    class="w-full border rounded p-2 focus:ring focus:ring-blue-300">
                <p class="text-xs text-gray-400 mt-1">Formato: LETRAS-ALFANUMERICO (ej: PROD-001, CEL-A12)</p>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-gray-700 font-bold mb-2">Nombre:</label>
                    <!-- SEGURIDAD: pattern exige al menos una letra y no permite mas de 2 caracteres especiales seguidos. -->
                    <input type="text" id="nombre"
                        required maxlength="200"
                        pattern=".*[A-Za-zÁÉÍÓÚáéíóúÑñ].*"
                        title="El nombre debe contener al menos una letra"
                        class="w-full border rounded p-2">
                </div>
                <div>
                    <label class="block text-gray-700 font-bold mb-2">Categoría:</label>
                    <input type="text" id="categoria"
                        required maxlength="100"
                        pattern=".*[A-Za-zÁÉÍÓÚáéíóúÑñ].*"
                        title="La categoría debe contener al menos una letra"
                        class="w-full border rounded p-2">
                </div>
            </div>

            <div class="grid grid-cols-3 gap-4">
                <div>
                    <label class="block text-gray-700 font-bold mb-2">Precio ($):</label>
                    <!-- SEGURIDAD: min="0" previene valores negativos desde el frontend. -->
                    <input type="number" step="0.01" min="0" id="precio"
                        required class="w-full border rounded p-2">
                </div>
                <div>
                    <label class="block text-gray-700 font-bold mb-2">Stock:</label>
                    <!-- SEGURIDAD: min="0" previene valores negativos desde el frontend. -->
                    <input type="number" min="0" id="stock"
                        required class="w-full border rounded p-2">
                </div>
                <div>
                    <label class="block text-gray-700 font-bold mb-2">Color:</label>
                    <!-- SEGURIDAD: Dropdown con opciones predefinidas para evitar valores arbitrarios.
                         La opción "Otro" habilita un campo de texto con validación. -->
                    <select id="color_select" onchange="toggleColorPersonalizado()" class="w-full border rounded p-2">
                        <option value="">-- Seleccionar --</option>
                        <option value="Rojo">Rojo</option>
                        <option value="Azul">Azul</option>
                        <option value="Verde">Verde</option>
                        <option value="Amarillo">Amarillo</option>
                        <option value="Negro">Negro</option>
                        <option value="Blanco">Blanco</option>
                        <option value="Gris">Gris</option>
                        <option value="Naranja">Naranja</option>
                        <option value="Morado">Morado</option>
                        <option value="Rosa">Rosa</option>
                        <option value="Café">Café</option>
                        <option value="Beige">Beige</option>
                        <option value="otro">Otro...</option>
                    </select>
                    <input type="text" id="color_personalizado"
                        maxlength="50"
                        pattern=".*[A-Za-zÁÉÍÓÚáéíóúÑñ].*"
                        title="El color debe contener al menos una letra"
                        placeholder="Escribe el color..."
                        class="w-full border rounded p-2 mt-1 hidden">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-gray-700 font-bold mb-2">Material:</label>
                    <input type="text" id="material"
                        maxlength="100"
                        pattern=".*[A-Za-zÁÉÍÓÚáéíóúÑñ].*"
                        title="El material debe contener al menos una letra"
                        class="w-full border rounded p-2">
                </div>
                <div>
                    <label class="block text-gray-700 font-bold mb-2">Talla:</label>
                    <input type="text" id="talla"
                        maxlength="50"
                        pattern=".*[A-Za-zÁÉÍÓÚáéíóúÑñ0-9].*"
                        title="La talla debe contener al menos una letra o número"
                        class="w-full border rounded p-2">
                </div>
            </div>

            <div>
                <label class="block text-gray-700 font-bold mb-2">Vendedor ID:</label>
                <input type="text" id="vendedorID"
                    maxlength="50"
                    pattern=".*[A-Za-zÁÉÍÓÚáéíóúÑñ0-9].*"
                    title="El Vendedor ID debe contener al menos una letra o número"
                    class="w-full border rounded p-2">
            </div>

            <!-- Sección de Logística de Envíos (Objeto Anidado) -->
            <fieldset class="border p-4 rounded mt-4 bg-gray-50">
                <legend class="font-bold text-gray-700 px-2">Logística de Envío</legend>
                <div class="grid grid-cols-3 gap-2 mt-2">
                    <div>
                        <label class="text-xs text-gray-600">Alto (cm):</label>
                        <!-- SEGURIDAD: min="0" previene valores negativos desde el frontend. -->
                        <input type="number" step="0.1" min="0" id="alto" class="w-full border rounded p-1 text-sm">
                    </div>
                    <div>
                        <label class="text-xs text-gray-600">Ancho (cm):</label>
                        <input type="number" step="0.1" min="0" id="ancho" class="w-full border rounded p-1 text-sm">
                    </div>
                    <div>
                        <label class="text-xs text-gray-600">Profundidad (cm):</label>
                        <input type="number" step="0.1" min="0" id="profundidad" class="w-full border rounded p-1 text-sm">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2 mt-3">
                    <div>
                        <label class="text-xs text-gray-600">Peso (Kg):</label>
                        <input type="number" step="0.1" min="0" id="peso_kg" class="w-full border rounded p-1 text-sm">
                    </div>
                    <div>
                        <label class="text-xs text-gray-600">Tipo de Empaque:</label>
                        <input type="text" id="tipo_empaque"
                            maxlength="100"
                            pattern=".*[A-Za-zÁÉÍÓÚáéíóúÑñ].*"
                            title="El tipo de empaque debe contener al menos una letra"
                            class="w-full border rounded p-1 text-sm">
                    </div>
                </div>
                <div class="mt-3 flex items-center">
                    <input type="checkbox" id="requiere_fragil" class="mr-2 h-4 w-4">
                    <label for="requiere_fragil" class="text-sm text-gray-700">¿Requiere manejo frágil?</label>
                </div>
            </fieldset>

            <div class="flex justify-between items-center mt-6">
                <a href="/" class="text-gray-600 hover:underline">← Cancelar</a>
                <button type="submit" class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-6 rounded shadow">Guardar</button>
            </div>
        </form>
    </div>

    <script>
        const pathParts = window.location.pathname.split('/');
        const esEditar = pathParts[1] === 'editar';
        const productoID = esEditar ? pathParts[2] : null;
        const COLORES_FIJOS = ['Rojo','Azul','Verde','Amarillo','Negro','Blanco','Gris','Naranja','Morado','Rosa','Café','Beige'];

        // Configura título y campo ID según el modo
        document.getElementById('titulo-pagina').textContent = (esEditar ? 'Editar' : 'Crear') + ' Producto';
        document.getElementById('titulo-h1').textContent = (esEditar ? 'Editar' : 'Crear') + ' Producto';
        const campoID = document.getElementById('productoID');
        if (esEditar) {
            campoID.readOnly = true;
            campoID.classList.add('bg-gray-100', 'text-gray-500');
        } else {
            campoID.required = true;
        }

        // SEGURIDAD: Todas las peticiones al /api incluyen X-Requested-With
        // para que el backend rechace cualquier acceso externo directo.
        function apiFetch(url, opciones = {}) {
            return fetch(url, {
                ...opciones,
                headers: {
                    'Content-Type': 'application/json',
                    'X-Requested-With': 'XMLHttpRequest',
                    ...(opciones.headers || {})
                }
            });
        }

        function mostrarAlerta(mensaje, tipo) {
            const alerta = document.getElementById('alerta');
            alerta.textContent = mensaje;
            alerta.className = `mb-4 p-4 rounded text-white ${tipo === 'success' ? 'bg-green-500' : 'bg-red-500'}`;
            alerta.classList.remove('hidden');
            setTimeout(() => alerta.classList.add('hidden'), 4000);
        }

        function toggleColorPersonalizado() {
            const select = document.getElementById('color_select');
            const input = document.getElementById('color_personalizado');
            if (select.value === 'otro') {
                input.classList.remove('hidden');
                input.required = true;
                input.value = '';
            } else {
                input.classList.add('hidden');
                input.required = false;
            }
        }

        function getColor() {
            const select = document.getElementById('color_select');
            return select.value === 'otro'
                ? document.getElementById('color_personalizado').value
                : select.value;
        }

        function setColor(valor) {
            const select = document.getElementById('color_select');
            const input = document.getElementById('color_personalizado');
            if (COLORES_FIJOS.includes(valor)) {
                select.value = valor;
            } else if (valor) {
                select.value = 'otro';
                input.classList.remove('hidden');
                input.required = true;
                input.value = valor;
            }
        }

        // Si es modo Editar, carga los datos del producto via fetch
        if (esEditar && productoID) {
            apiFetch(`/api/productos/${productoID}`)
                .then(res => res.json())
                .then(p => {
                    campoID.value = p.productoID || '';
                    document.getElementById('nombre').value = p.Nombre || '';
                    document.getElementById('categoria').value = p.Categoria || '';
                    document.getElementById('precio').value = p.Precio || '';
                    document.getElementById('stock').value = p.Stock || '';
                    document.getElementById('material').value = p.Material || '';
                    document.getElementById('talla').value = p.Talla || '';
                    document.getElementById('vendedorID').value = p.VendedorID || '';
                    setColor(p.Color || '');
                    const log = p.LogisticaEnvio || {};
                    const dim = log.DimensionesCm || {};
                    document.getElementById('alto').value = dim.Alto || '';
                    document.getElementById('ancho').value = dim.Ancho || '';
                    document.getElementById('profundidad').value = dim.Profundidad || '';
                    document.getElementById('peso_kg').value = log.PesoKg || '';
                    document.getElementById('tipo_empaque').value = log.TipoEmpaque || '';
                    document.getElementById('requiere_fragil').checked = log.RequiereFragil || false;
                })
                .catch(() => mostrarAlerta('Error al cargar el producto.', 'error'));
        }

        // Envío del formulario via fetch JSON
        document.getElementById('form-producto').addEventListener('submit', async function (e) {
            e.preventDefault();
            if (!this.checkValidity()) { this.reportValidity(); return; }

            const payload = {
                productoID: document.getElementById('productoID').value,
                nombre: document.getElementById('nombre').value,
                categoria: document.getElementById('categoria').value,
                precio: document.getElementById('precio').value,
                stock: document.getElementById('stock').value,
                color: getColor(),
                material: document.getElementById('material').value,
                talla: document.getElementById('talla').value,
                vendedorID: document.getElementById('vendedorID').value,
                alto: document.getElementById('alto').value,
                ancho: document.getElementById('ancho').value,
                profundidad: document.getElementById('profundidad').value,
                peso_kg: document.getElementById('peso_kg').value,
                tipo_empaque: document.getElementById('tipo_empaque').value,
                requiere_fragil: document.getElementById('requiere_fragil').checked
            };

            const url = esEditar ? `/api/productos/${productoID}` : '/api/productos';
            const metodo = esEditar ? 'PUT' : 'POST';

            try {
                const res = await apiFetch(url, { method: metodo, body: JSON.stringify(payload) });
                const data = await res.json();
                if (res.ok) {
                    mostrarAlerta(data.mensaje, 'success');
                    setTimeout(() => window.location.href = '/', 1500);
                } else {
                    mostrarAlerta(data.error || 'Error al guardar.', 'error');
                }
            } catch {
                mostrarAlerta('Error al conectar con el servidor.', 'error');
            }
        });
    </script>
</body>
</html>
